services:
  finguard:
    build: .
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in your shell}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      FINGUARD_ACCESS_TOKEN: ${FINGUARD_ACCESS_TOKEN:?Set a random workspace token}
      FINGUARD_DB: /app/data/tasks.sqlite3
    volumes:
      - finguard-data:/app/data
volumes:
  finguard-data:
