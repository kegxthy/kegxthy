<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FinGuard AI</title><style>
:root{color-scheme:light;--ink:#202d40;--muted:#63758b;--line:#dce4ee;--blue:#285fc0}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font:15px/1.6 system-ui,sans-serif}header{padding:18px 4%;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}header b{font-size:22px}main{max-width:1440px;margin:auto;padding:32px 4%}h1{font-size:38px;line-height:1.2;letter-spacing:-1px}h2{font-size:18px;margin-top:0}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;min-width:0}label{display:block;margin:12px 0 6px}input,textarea,select{font:inherit;max-width:100%}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fbfcff}textarea{height:110px}button{font:inherit;border:0;border-radius:7px;background:var(--blue);color:white;padding:10px 16px;cursor:pointer;margin:6px 5px 6px 0}button.secondary{background:#edf2fa;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:14px;border-radius:8px;max-height:330px;overflow:auto;font:12px/1.7 monospace}.figure{border:1px solid var(--line);padding:15px;margin:12px 0;border-radius:10px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.signal{border-left:3px solid #c66b51;padding:12px;background:#fff6f0;margin:12px 0}details{margin:10px 0}summary{cursor:pointer}#notice{white-space:pre-wrap;color:#9d3c28}.badge{border-radius:20px;padding:6px 14px;background:#eaf0fc;display:inline-block}.history{display:block;width:100%;text-align:left;overflow-wrap:anywhere}.source{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}a{color:var(--blue)}@media(max-width:850px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}h1{font-size:29px}header{flex-wrap:wrap}}
</style></head><body><header><b>FinGuard <span style="color:#285fc0">AI</span></b><span data-i="workspace"></span><button id="lang" class="secondary">English</button></header><main><h1 data-i="title"></h1><p class="muted" data-i="intro"></p><p id="notice" role="alert"></p><div class="grid"><aside><section class="card"><h2 data-i="configure"></h2><label data-i="token"></label><input id="token" type="password" autocomplete="off"><small data-i="tokenNote"></small><label data-i="document"></label><input id="file" type="file" accept=".pdf,.docx,.xlsx"><small>PDF / DOCX / XLSX · 12 MB</small><label data-i="preset"></label><select id="preset"><option value="all" data-i="all"></option><option value="cash" data-i="cash"></option><option value="liquidity" data-i="liquidity"></option></select><label data-i="focus"></label><textarea id="focus" maxlength="2000"></textarea><label><input id="consent" type="checkbox"> <span data-i="consent"></span></label><button id="upload" data-i="upload"></button></section><section class="card"><h2 data-i="history"></h2><button id="refresh" class="secondary" data-i="refresh"></button><div id="history"></div></section></aside><article><section class="card"><h2 data-i="execution"></h2><span id="state" class="badge">—</span><p id="expiry" class="muted"></p><pre id="events" aria-live="polite"></pre></section><section class="card"><h2 data-i="review"></h2><p class="muted" data-i="reviewNote"></p><div id="figures"></div><button id="add" class="secondary" data-i="add" hidden></button><button id="confirm" data-i="confirm" hidden></button></section><section class="card"><h2 data-i="results"></h2><div id="results"></div></section><section class="card"><h2 data-i="sources"></h2><div id="sources"></div></section></article></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dict={zh:{workspace:'财务风险分析工作台 · V1',title:'让每一项风险信号，都有据可查。',intro:'原文提取 → 人工确认 → 确定性计算 → 规则筛查 → DeepSeek 工具调用 → 报告。风险信号需专业复核，不构成评级、审计结论或投资建议。',configure:'01 / 分析配置',token:'工作区访问令牌',tokenNote:'令牌为必填，仅保存在页面内存；持令牌的受信组成员共享全部任务。',document:'公开、非敏感财报',preset:'分析目标',all:'综合分析',cash:'现金流质量',liquidity:'流动性与偿债能力',focus:'自定义关注点',consent:'我批准将此文档发送至 DeepSeek，并确认有权处理其内容。',upload:'上传并提取',history:'任务历史',refresh:'刷新',execution:'02 / 实际执行日志',review:'03 / 关键数据确认',reviewNote:'仅勾选同一期间、同一币种、合并口径的数据，每项指标仅选一条。核对原文、单位倍率和数值。期间使用起止日期 YYYY-MM-DD/YYYY-MM-DD；只接受合并口径。行号从 1 开始，数字索引从 0 开始，选择原文行上的确切数字。可修正或添加；引用必须包含所填数字。缺失项目不会补造。',add:'添加数据',confirm:'确认并运行分析',results:'04 / 风险分析结果',sources:'原文证据',value:'数值',period:'期间',currency:'币种',scale:'倍率',quote:'原文引句',source_id:'来源 ID',field:'指标',scope:'报表口径',line_number:'原文行号（从1起）',number_index:'数字索引（从0起）',demo:'公开预览仅展示界面：禁止上传、读取任务或处理敏感资料。',expiry:'到期自动清理',extracting:'正在提取',needs_review:'等待数据确认',analyzing:'正在分析',completed:'已完成',failed:'失败',ratios:'确定性比率',signals:'规则风险信号',observations:'模型解读（未经独立验证）',limitations:'缺失数据与限制',trace:'工具执行记录',none:'未触发已配置规则。这不代表不存在风险。',pdf:'下载 PDF',del:'删除任务',empty:'暂无任务',rejected:'被丢弃的模型解读',selected:'使用此项',error:'操作失败'},en:{workspace:'Financial risk workspace · V1',title:'Every risk signal starts with evidence.',intro:'Extract → confirm → calculate → screen → DeepSeek tool calls → report. Signals require professional review; they are not ratings, audit conclusions or investment advice.',configure:'01 / Configure analysis',token:'Workspace access token',tokenNote:'Required, including localhost. Kept in page memory; all trusted token holders share tasks.',document:'Public, non-sensitive report',preset:'Analysis goal',all:'Comprehensive review',cash:'Cash flow quality',liquidity:'Liquidity and solvency',focus:'Custom focus',consent:'I approve sending this document to DeepSeek and have authority to process it.',upload:'Upload and extract',history:'Task history',refresh:'Refresh',execution:'02 / Actual execution log',review:'03 / Confirm critical figures',reviewNote:'Select one consolidated figure per field, for a single period and currency. Verify source, scale and value. Use reporting interval YYYY-MM-DD/YYYY-MM-DD and consolidated scope. Line numbers start at 1; numeric token indexes start at 0. Edit or add figures with verbatim evidence containing the number. Missing inputs stay missing.',add:'Add figure',confirm:'Confirm and analyze',results:'04 / Analysis results',sources:'Source evidence',value:'Value',period:'Period',currency:'Currency',scale:'Scale',quote:'Verbatim quote',source_id:'Source ID',field:'Field',scope:'Statement scope',line_number:'Line number (1-based)',number_index:'Numeric token (0-based)',demo:'Public preview only: uploads, stored tasks and sensitive documents are disabled.',expiry:'Automatic expiry',extracting:'Extracting',needs_review:'Needs confirmation',analyzing:'Analyzing',completed:'Completed',failed:'Failed',ratios:'Deterministic ratios',signals:'Rule signals',observations:'Model interpretation (not independently verified)',limitations:'Missing data and limitations',trace:'Tool execution',none:'No configured rule triggered. This does not establish absence of risk.',pdf:'Download PDF',del:'Delete task',empty:'No tasks',rejected:'Discarded model observations',selected:'Use this figure',error:'Operation failed'}};
let lang=localStorage.getItem('finguard-language')||'zh',task=null,timer=null,editing=false,publicDemo=false;
const t=k=>dict[lang][k]||k;
function language(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('lang').textContent=lang==='zh'?'English':'中文';if(task)render(task,true);if(publicDemo)$('notice').textContent=t('demo')}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('finguard-language',lang);language();history()};
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),...($('token').value?{Authorization:'Bearer '+$('token').value}:{})}});if(!r.ok){const d=await r.json();throw Error(d.detail?JSON.stringify(d.detail):r.status)}return r}
async function guarded(fn){try{$('notice').textContent='';await fn()}catch(e){$('notice').textContent=t('error')+': '+e.message}}
async function history(){if(publicDemo)return;await guarded(async()=>{const rows=await(await api('/api/tasks')).json();$('history').innerHTML=rows.map(x=>'<button class="secondary history" data-id="'+esc(x.id)+'">'+esc(x.filename)+' · '+esc(t(x.status))+'<br><small>'+esc(x.updated_at)+'</small></button>').join('')||t('empty');$('history').querySelectorAll('button').forEach(b=>b.onclick=()=>guarded(()=>load(b.dataset.id)))})}
async function load(id){clearTimeout(timer);const d=await(await api('/api/tasks/'+id)).json();render(d);if(['extracting','analyzing'].includes(d.status))timer=setTimeout(()=>guarded(()=>load(id)),1500);else history()}
const fields=['revenue','net_profit','operating_cash_flow','accounts_receivable','current_assets','current_liabilities','total_assets','total_liabilities'];
function figure(f={},checked=false){const div=document.createElement('div');div.className='figure';div.innerHTML='<label><input class="selected" type="checkbox" '+(checked?'checked':'')+'> '+esc(t('selected'))+'</label><div class="fields">'+['field','value','period','currency','scale','scope','source_id','line_number','number_index'].map(k=>'<label>'+esc(t(k))+(k==='field'?'<select data-key="field">'+fields.map(x=>'<option '+(x===f.field?'selected':'')+'>'+x+'</option>').join('')+'</select>':'<input data-key="'+k+'" value="'+esc(f[k]??(k==='scale'||k==='line_number'?1:k==='number_index'?0:k==='scope'?'consolidated':''))+'">')+'</label>').join('')+'</div><label>'+esc(t('quote'))+'</label><textarea data-key="quote">'+esc(f.quote||'')+'</textarea>';$('figures').append(div)}
function prettySection(kind,data){const wrap=document.createElement('div');
const line=(parent,text)=>{const p=document.createElement('p');p.textContent=text;parent.append(p)};
const evidence=(parent,ids)=>{for(const id of ids||[]){const b=document.createElement('button');b.className='secondary';b.textContent=id;b.onclick=()=>{const el=document.getElementById(id);if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'center'})}};parent.append(b)}};
if(kind==='ratios'){for(const [name,r] of Object.entries(data)){const c=document.createElement('div');c.className='figure';const b=document.createElement('b');b.textContent=name+' · '+r.value;c.append(b);line(c,r.formula);evidence(c,r.source_ids);wrap.append(c)}}
if(kind==='signals'){if(!data.length)line(wrap,t('none'));for(const r of data){const c=document.createElement('div');c.className='signal';line(c,r.code+' · '+r.severity);if(r.threshold)line(c,r.metric+': '+r.value+' | '+r.operator+' '+r.threshold+' (unrounded / 未舍入值判定)');evidence(c,r.source_ids);wrap.append(c)}}
if(kind==='observations'){for(const o of data){const c=document.createElement('div');line(c,o.text);evidence(c,o.source_ids);wrap.append(c)}}
if(kind==='limitations'){for(const item of data)line(wrap,item)}
if(kind==='tool_trace'){for(const call of data){const d=document.createElement('details'),s=document.createElement('summary'),pre=document.createElement('pre');s.textContent=call.tool;pre.textContent=JSON.stringify(call.result,null,2);d.append(s,pre);wrap.append(d)}}return wrap}
function render(d,force=false){const changed=!task||task.id!==d.id||task.status!==d.status;task=d;$('state').textContent=t(d.status);$('expiry').textContent=t('expiry')+': '+d.expires_at;$('events').textContent=d.events.map(e=>e.at+' · '+e.message).join('\n');if(d.error)$('notice').textContent=d.error;
if(changed||force){$('figures').innerHTML='';d.figures.forEach(f=>figure(f,false));$('add').hidden=$('confirm').hidden=d.status!=='needs_review';$('figures').querySelectorAll('input,textarea,select').forEach(e=>e.disabled=d.status!=='needs_review');$('sources').innerHTML=d.sources.map(s=>'<details id="'+esc(s.id)+'"><summary>'+esc(s.id)+'</summary><div class="source">'+esc(s.text)+'</div></details>').join('');}
$('results').innerHTML='';if(d.result){const r=d.result;for(const k of ['ratios','signals','observations','limitations','tool_trace']){const h=document.createElement('h3');h.textContent=t(k==='tool_trace'?'trace':k);$('results').append(h);$('results').append(prettySection(k,r[k]))}const p=document.createElement('p');p.textContent=t('rejected')+': '+r.discarded_observations;$('results').append(p);const pdf=document.createElement('button');pdf.textContent=t('pdf');pdf.onclick=()=>guarded(async()=>{const blob=await(await api('/api/tasks/'+d.id+'/pdf')).blob();const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='finguard-report.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});$('results').append(pdf)}
const limits=document.createElement('pre');limits.textContent=d.warnings.join('\n');$('results').append(limits);if(!['extracting','analyzing'].includes(d.status)){const b=document.createElement('button');b.className='secondary';b.textContent=t('del');b.onclick=()=>guarded(async()=>{await api('/api/tasks/'+d.id,{method:'DELETE'});location.reload()});$('results').append(b)}}
$('add').onclick=()=>figure();$('refresh').onclick=history;$('token').onchange=history;
$('upload').onclick=()=>guarded(async()=>{if(!$('file').files[0]||!$('consent').checked)throw Error(t('document')+' / '+t('consent'));$('upload').disabled=true;try{const fd=new FormData();fd.append('file',$('file').files[0]);fd.append('provider_consent','true');fd.append('focus',t($('preset').value)+'; '+$('focus').value);const d=await(await api('/api/tasks',{method:'POST',body:fd})).json();await load(d.id)}finally{$('upload').disabled=false}});
$('confirm').onclick=()=>guarded(async()=>{const figures=[...$('figures').querySelectorAll('.figure')].filter(e=>e.querySelector('.selected').checked).map(e=>Object.fromEntries([...e.querySelectorAll('[data-key]')].map(x=>[x.dataset.key,['scale','line_number','number_index'].includes(x.dataset.key)?Number(x.value):x.value])));await api('/api/tasks/'+task.id+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({figures})});await load(task.id)});
language();guarded(async()=>{const h=await(await fetch('/health')).json();publicDemo=h.mode==='public_demo';if(publicDemo){$('notice').textContent=t('demo');for(const id of ['upload','file','focus','consent','token','refresh','preset'])$(id).disabled=true;}else if($('token').value)await history();});
</script></body></html>
